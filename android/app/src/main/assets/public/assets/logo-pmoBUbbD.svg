<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="sparkleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#a855f7" />
      <stop offset="100%" stopColor="#6b21a8" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#09090b" />
      <stop offset="100%" stopColor="#27272a" />
    </linearGradient>
  </defs>

  <!-- Viewfinder Frame Corners with purple stroke -->
  <g stroke="#8b5cf6" stroke-width="6.5" stroke-linecap="round" fill="none" filter="url(#soft-glow)">
    <path d="M 125 75 L 105 75 A 25 25 0 0 0 80 100 L 80 120" />
    <path d="M 275 75 L 295 75 A 25 25 0 0 1 320 100 L 320 120" />
    <path d="M 80 275 L 80 295 A 25 25 0 0 0 105 320 L 125 320" />
    <path d="M 320 275 L 320 295 A 25 25 0 0 1 295 320 L 275 320" />
  </g>

  <!-- Glowing 4-point magical star centerpiece -->
  <path 
    d="M 200 90 C 200 118 185 133 155 133 C 185 133 200 148 200 176 C 200 148 215 133 245 133 C 215 133 200 118 200 90 Z" 
    fill="url(#sparkleGradient)" 
    filter="url(#soft-glow)" 
  />

  <!-- Secondary micro star sparkles & dust nodes -->
  <path d="M 162 113 C 162 117 159 119 155 119 C 159 119 162 121 162 125 C 162 121 165 119 169 119 C 165 119 162 117 162 113 Z" fill="#9333ea" />
  <path d="M 238 143 C 238 147 235 149 231 149 C 235 149 238 151 238 155 C 238 151 241 149 245 149 C 241 149 238 147 238 143 Z" fill="#9333ea" />
  <path d="M 218 158 C 218 161 216 162 213 162 C 216 162 218 163 218 166 C 218 163 220 162 223 162 C 220 162 218 161 218 158 Z" fill="#7c3aed" />
  
  <circle cx="168" cy="150" r="3.5" fill="#a855f7" />
  <circle cx="230" cy="115" r="3.5" fill="#a855f7" />

  <!-- 3D-effect Layered Open Book Pages -->
  <path d="M 200 245 C 170 241 135 251 108 255 C 111 218 119 184 123 178 C 143 176 173 166 200 176 Z" fill="#7e22ce" opacity="0.25" />
  <path d="M 200 245 C 230 241 265 251 292 255 C 289 218 281 184 277 178 C 257 176 227 166 200 176 Z" fill="#7e22ce" opacity="0.25" />

  <!-- Middle purple page layer -->
  <path d="M 200 248 C 170 242 130 253 104 253 C 107 214 116 179 120 173 C 140 171 171 161 200 161 Z" fill="#9333ea" />
  <path d="M 200 248 C 230 242 270 253 296 253 C 293 214 284 179 280 173 C 260 171 229 161 200 161 Z" fill="#9333ea" />

  <!-- Front illuminated left page -->
  <path d="M 200 251 C 165 241 118 253 98 249 C 101 206 113 171 118 164 C 138 162 168 151 200 161 Z" fill="#ffffff" stroke="#a855f7" stroke-width="2.5" />
  <path d="M 200 251 C 165 241 118 253 98 249" fill="none" stroke="#7e22ce" stroke-width="3" />

  <!-- Front illuminated right page -->
  <path d="M 200 251 C 235 241 282 253 302 249 C 299 206 287 171 282 164 C 262 162 232 151 200 161 Z" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5" />
  <path d="M 200 251 C 235 241 282 253 302 249" fill="none" stroke="#7e22ce" stroke-width="3" />

  <!-- Center Page Spine -->
  <path d="M 200 161 L 200 251" stroke="#6b21a8" stroke-width="4" stroke-linecap="round" />

  <!-- Typography -->
  <g>
    <line x1="110" y1="284" x2="110" y2="304" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="290" y1="284" x2="290" y2="304" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round" />
    <text x="200" y="301" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="bold" text-anchor="middle" font-size="25">
      <tspan fill="url(#textGradient)">HelpYou</tspan>
      <tspan fill="#9333ea" font-weight="900"> AI</tspan>
    </text>
  </g>
</svg>
