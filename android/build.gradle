// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        exclude group: 'androidx.datastore', module: 'datastore-jvm'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-jvm'
        exclude group: 'androidx.datastore', module: 'datastore-core-jvm'
        exclude group: 'androidx.datastore', module: 'datastore-preferences-core-jvm'

        resolutionStrategy {
            force 'androidx.datastore:datastore-preferences:1.0.0'
            force 'androidx.datastore:datastore-preferences-core:1.0.0'
            force 'androidx.datastore:datastore:1.0.0'
            force 'androidx.datastore:datastore-core:1.0.0'
        }
    }
}

ext {
    kotlin_version = '1.9.22'
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 34
    androidxActivityVersion = '1.8.2'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
    rgcfaIncludeGoogle = true
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.matching { it.name.contains("Kotlin") }.configureEach {
            try {
                kotlinOptions {
                    jvmTarget = "17"
                }
            } catch (Exception e) {
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
