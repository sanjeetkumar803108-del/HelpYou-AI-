// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.1'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        // Force all Kotlin tasks to compile with JVM 17 target to match Java compile target
        project.tasks.matching { it.class.name.contains("KotlinCompile") }.configureEach {
            try {
                kotlinOptions {
                    jvmTarget = "17"
                }
            } catch (Exception e) {
                // Ignore if kotlinOptions property is missing dynamically
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
