# Increase Gradle JVM Heap memory and Metaspace with UTF-8 encoding
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Prevent Kotlin daemon startup termination on Windows by running in-process or bounded JVM
kotlin.daemon.jvm.options=-Xmx1536m
kotlin.compiler.execution.strategy=in-process

# Enable caching and build performance
org.gradle.parallel=true
org.gradle.caching=true

# Enable AndroidX support for all dependencies
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
android.jetifier.ignorelist=byte-buddy

# Suppress warnings about unsupported SDK versions
android.suppressUnsupportedCompileSdk=36
