# Increase Gradle JVM Heap memory to 4GB to prevent Java Heap Space OutOfMemory errors during D8 DEX compilation
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Enable AndroidX support for all dependencies
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# Suppress warnings about unsupported SDK versions
android.suppressUnsupportedCompileSdk=36
