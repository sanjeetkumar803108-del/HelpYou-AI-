<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- Top-left corner bracket -->
  <path d="M 28,10 L 16,10 A 10,10 0 0,0 6,20 L 6,32" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />
  
  <!-- Top-right corner bracket -->
  <path d="M 92,10 L 104,10 A 10,10 0 0,1 114,20 L 114,32" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />
  
  <!-- Bottom-left corner bracket -->
  <path d="M 6,88 L 6,100 A 10,10 0 0,0 16,110 L 28,110" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />
  
  <!-- Bottom-right corner bracket -->
  <path d="M 114,88 L 114,100 A 10,10 0 0,1 104,110 L 92,110" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round" />

  <!-- Four-Pointed Sparkle (Star) -->
  <path d="M 60,10 Q 60,24 46,24 Q 60,24 60,38 Q 60,24 74,24 Q 60,24 60,10 Z" fill="#8B5CF6" />

  <!-- Sparkle floating accent dots -->
  <circle cx="41" cy="23" r="2" fill="#8B5CF6" />
  <circle cx="44" cy="37" r="2.5" fill="#8B5CF6" />
  <circle cx="73" cy="22" r="2" fill="#8B5CF6" />
  <circle cx="76" cy="33" r="2.5" fill="#8B5CF6" />

  <!-- 3D Underlying Page Layers for Depth -->
  <path d="M 18,84 C 32,74 48,73 60,86 C 72,73 88,74 102,84" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" opacity="0.4" />
  <path d="M 20,86 C 34,76 48,75 60,88 C 72,75 86,76 100,86" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round" opacity="0.2" />

  <!-- Open Book Main Pages (Filled white with violet outline) -->
  <!-- Left Page Shape -->
  <path d="M 60,42 C 48,37 32,39 15,51 L 15,81 C 32,69 48,70 60,83 Z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Right Page Shape -->
  <path d="M 60,42 C 72,37 88,39 105,51 L 105,81 C 88,69 72,70 60,83 Z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3" stroke-linejoin="round" />

  <!-- Middle Spine Page Divider -->
  <line x1="60" y1="42" x2="60" y2="83" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" />
</svg>
